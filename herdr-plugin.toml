id = "launcher"
name = "Launcher"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "A floating launcher menu for your plugin panels"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "menu"
title = "Open the launcher"
contexts = ["global", "workspace", "tab", "pane"]
command = ["target/release/herdr-launcher", "open"]

[[panes]]
id = "menu"
title = "Launcher"
placement = "popup"
width = 56
height = 16
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-launcher\""]
