[package]
name = "herdr-launcher"
version = "0.3.0"
edition = "2021"
description = "Herdr plugin: a floating launcher menu for your plugin panels"
license = "MIT"
publish = false

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
